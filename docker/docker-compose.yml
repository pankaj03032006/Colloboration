version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: collab-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  server:
    build:
      context: ../server
      dockerfile: ../docker/server.Dockerfile
    container_name: collab-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://admin:password@mongodb:27017/collab?authSource=admin
    depends_on:
      - mongodb

  client:
    build:
      context: ../client
      dockerfile: ../docker/client.Dockerfile
    container_name: collab-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongodb_data: